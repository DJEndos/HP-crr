<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage CRPS — Log In</title>
<link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="head">
      <div class="crest">HP</div>
      <h1>Heritage Polytechnic</h1>
      <p>COURSE REGISTRATION &amp; RESULT PROCESSING SYSTEM</p>
    </div>
    <div class="body">
      <div id="alertBox"></div>
      <form id="loginForm">
        <label for="identifier">Email, Reg./Staff No.</label>
        <input id="identifier" type="text" placeholder="e.g. HP/2023/CSC/045" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required>

        <button type="submit" class="primary">Log In</button>
      </form>
      <p class="foot">New student? <a href="/frontend/register.html">Create account</a></p>
    </div>
  </div>
</div>

<script src="/frontend/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';

  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await apiRequest('/auth/login', { method: 'POST', body: { identifier, password } });
    Auth.saveSession(data);

    if (data.role === 'student') window.location.href = 'student-dashboard.html';
    else if (data.role === 'lecturer') window.location.href = 'lecturer-dashboard.html';
    else if (data.role === 'admin') window.location.href = 'admin-dashboard.html';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert err">${err.message}</div>`;
  }
});
</script>
</body>
</html>
